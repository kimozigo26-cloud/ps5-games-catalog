<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كتالوج ألعاب PlayStation 5</title>
<style>
:root{color-scheme:dark;--bg:#070b14;--line:#263550;--blue:#4085ff;--muted:#a6b4ca}
*{box-sizing:border-box}
body{margin:0;color:#f4f7ff;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(ellipse at 15% 0%,#162c55 0,transparent 38%),var(--bg)}
header{padding:42px 6%;background:linear-gradient(115deg,#101a30,#173d82 68%,#12606e);border-bottom:1px solid #4b8eff}
header h1{margin:0 0 10px;font-size:clamp(27px,5vw,44px)}
header p{margin:0;color:#d0def5}
main{max-width:1250px;margin:auto;padding:28px 18px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
input,button{font:inherit}
input{background:#0c1422;color:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
input:focus{outline:2px solid #4085ff88}
#search{flex:1;min-width:210px}
button{background:linear-gradient(135deg,#3675ed,#4b9cff);color:#fff;border:0;border-radius:11px;padding:11px 17px;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.12)}
.secondary{background:#263550}.danger{background:#a83245}
#count{color:var(--muted);margin:8px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:18px}
.card{background:linear-gradient(160deg,#141f33,#0e1726);border:1px solid #253653;border-radius:17px;overflow:hidden;transition:.2s}
.card:hover{transform:translateY(-4px);border-color:#4b8eff}
.cover{height:165px;background:linear-gradient(135deg,#172949,#254878);display:grid;place-items:center;color:#c1d2ef}
.cover img{width:100%;height:100%;object-fit:cover}
.info{padding:15px}.info h2{font-size:17px;margin:0 0 12px;line-height:1.5}
.meta{font-size:13px;color:var(--muted);line-height:2}
.price{display:inline-block;margin-top:7px;padding:5px 10px;border:1px solid #39c7b488;border-radius:999px;background:#123b3a;color:#78f0d2;font-weight:bold}
.actions{display:flex;gap:8px;margin-top:13px}.actions button{flex:1;padding:9px}
.hidden{display:none!important}
dialog{width:min(500px,calc(100% - 24px));border:1px solid var(--line);border-radius:16px;background:#111b2c;color:#fff;padding:22px}
dialog::backdrop{background:#000b;backdrop-filter:blur(4px)}
.form{display:grid;gap:13px}.form label{display:grid;gap:7px;color:#d5def0}.form input{width:100%}
.form-buttons{display:flex;gap:8px}.notice{color:var(--muted);font-size:13px;line-height:1.7}
footer{text-align:center;color:var(--muted);padding:30px}
</style>
</head>
<body>
<header>
  <h1>🎮 قائمة ألعاب PlayStation 5</h1>
  <p>مركز البروفسير — كتالوج الألعاب</p>
</header>
<main>
  <div class="toolbar">
    <input id="search" type="search" placeholder="ابحث بالاسم أو الكود أو المساحة أو السعر…">
    <button id="loginBtn">دخول لوحة التحكم</button>
    <button id="addBtn" class="hidden">＋ إضافة لعبة</button>
    <button id="logoutBtn" class="secondary hidden">تسجيل الخروج</button>
  </div>
  <div id="count"></div>
  <section id="games" class="grid"></section>
</main>
<footer>كتالوج ألعاب PS5</footer>

<dialog id="loginDialog">
  <h2>دخول لوحة التحكم</h2>
  <form id="loginForm" class="form">
    <label>كلمة المرور<input id="password" type="password" required></label>
    <div class="form-buttons">
      <button type="submit">دخول</button>
      <button type="button" class="secondary" data-close="loginDialog">إلغاء</button>
    </div>
    <div class="notice">نسخة محلية للتجربة؛ كلمة المرور داخل ملف الموقع وليست حماية مناسبة لموقع منشور.</div>
  </form>
</dialog>

<dialog id="gameDialog">
  <h2 id="formTitle">إضافة لعبة</h2>
  <form id="gameForm" class="form">
    <input id="gameIndex" type="hidden">
    <label>اسم اللعبة<input id="title" type="text" required></label>
    <label>كود اللعبة<input id="code" type="text" placeholder="—"></label>
    <label>المساحة بالجيجابايت<input id="size" type="number" min="0" step="0.1" placeholder="—"></label>
    <label>السعر بالجنيه المصري<input id="price" type="number" min="0" step="0.01" placeholder="مثال: 1500"></label>
    <label>صورة اللعبة<input id="image" type="file" accept="image/*"></label>
    <div class="form-buttons">
      <button type="submit">حفظ</button>
      <button type="button" class="secondary" data-close="gameDialog">إلغاء</button>
    </div>
  </form>
</dialog>

<script>
const PASSWORD = "Kimo2030";
const STORAGE_KEY = "ps5_catalog_v1";

const initialData = `A Plague Tale Innocence|PPSA02387-app0|40.2
A Plague Tale Requiem|PPSA05366-app0|52.2
Assetto Corsa Competizione|PPSA03847-app|18.9
ASTRO BOT|PPSA21564-app|149.3
Atomic Heart|PPSA10695-app|92.0
Avatar Frontiers of Pandora|PPSA01576-app|175.6
Baldurs Gate 3|PPSA18463-app|119.8
Black Myth Wukong|PPSA23226|—
Control Ultimate Edition|PPSA01951-app|44.0
Crash Bandicoot 4 Its About Time|PPSA02433-app|47.8
Cyberpunk Ultimate Edition|PPSA04029-app|242.1
Days Gone Remastered|PPSA28180-app|55.4
Dead Island 2 Ultimate Edition|PPSA03098-app|151.9
Demon Slayer Sweep the Board|PPSA21268-app|10.8

Demon Slayer Hinokami Chronicles 2|PPSA25428-app|53.4

Devil May Cry 5 Special Edition|PPSA01442-app|63.4
Disciples Liberation|PPSA02650-app|8.3
Disgaea 7 Vows of The Virtueless|PPSA13844-app|33.2
Disney Epic Mickey Rebrushed|PPSA15656-app|35.7
DOOM The Dark Ages|PPSA20560-app|162.8
Dragon Ball Sparking Zero|PPSA15210-app0|59.6
Dragons Dogma 2|PPSA09664-app|135.6
EA SPORTS FC 26|PPSA27360|—
Elden Ring|—|77.5
Ghost of Yōtei|PPSA26344|—
Ghostrunner 2|PPSA09911-app|28.8
Ghostwire Tokyo|PPSA03397-app|40.2
Goat Simulator 3|PPSA04159-app|7.0
Grand Theft Auto San Andreas Edition|PPSA03525-app|22.7
Grand Theft Auto Vice City Edition|PPSA03531-app|10.9
Grand Theft Auto V|PPSA04264-app|—
Hogwarts Legacy|PPSA01593-app|162.2
It Takes Two|PPSA02343-app|40.9
Legacy of Kain Soul Reaver 1 and 2|PPSA18152-app|17.8
LEGO Horizon Adventures|PPSA14632-app|27.6

Medieval Dynasty|PPSA07933-app|6.0
Metal Gear Solid Delta Snake Eater|PPSA15304-app|186.1
Metal Gear Solid Master Collection Vol 1|PPSA16256-app|0.5
Metal Slug Tactics|PPSA20643-app|0.9
Metro Awakening|PPSA19383-app|88.7
Minecraft|PPSA17221-app|1.0
Minecraft Legends|PPSA05510-app|7.1
Minecraft Preview|PPSA19639-app|1.1
Monster Hunter Wilds|PPSA07862-app|154.0
Monster Jam Showdown|PPSA16159-app|23.6
Monster Truck Championship|PPSA01902|26.5
Morbid The Lords of Ire|PPSA13524-app|23.2
Mortal Kombat 1|PPSA07570|—
Mortal Kombat 11 Ultimate|PPSA01619-app|115.9
Mortal Kombat Legacy Kollection|PPSA28068-app|23.7
MotoGP 24|PPSA19566-app|39.6
MX vs ATV Legends|PPSA04734-app|96.5
Need for Speed Unbound|PPSA01716-app|31.2
Poppy Playtime Chapter 1|PPSA20591-app|5.5
Poppy Playtime Chapter 2|PPSA21631-app|8.9
Poppy Playtime Chapter 3|PPSA22380-app|31.6
REANIMAL|PPSA23372-app|27.7`;

function loadGames(){
  try{
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
    if(Array.isArray(saved)&&saved.length>=65)return saved.map(g=>({price:"",...g}));
  }catch{}
  return initialData.trim().split(/\r?\n/).map((row,i)=>{
    const [title,code,size]=row.split("|");
    return {title,code,size,price:"",image:"",number:i+1};
  });
}
let games=loadGames(), admin=false;
const $=id=>document.getElementById(id);

function save(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(games))}
  catch{alert("تعذر الحفظ؛ مساحة التخزين ممتلئة. جرّب صورة أصغر.")}
}
function esc(value){
  return String(value??"").replace(/[&<>"']/g,ch=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}
function render(){
  const q=$("search").value.trim().toLowerCase();
  const shown=games.filter(g=>
    `${g.title} ${g.code} ${g.size} ${g.price}`.toLowerCase().includes(q)
  );
  $("count").textContent=`إجمالي الألعاب: ${games.length} — المعروض: ${shown.length}`;
  $("games").innerHTML=shown.map(g=>{
    const i=games.indexOf(g);
    return `<article class="card">
      <div class="cover">${g.image?`<img src="${g.image}" alt="${esc(g.title)}">`:"🎮 أضف صورة اللعبة"}</div>
      <div class="info"><h2>${esc(g.title)}</h2>
        <div class="meta">
          كود اللعبة: ${esc(g.code||"—")}<br>
          المساحة: ${esc(g.size||"—")}${g.size&&g.size!=="—"?" GB":""}
          ${g.price?`<div class="price">${esc(g.price)} جنيه مصري</div>`:""}
        </div>
        ${admin?`<div class="actions">
          <button class="secondary" onclick="editGame(${i})">تعديل</button>
          <button class="danger" onclick="deleteGame(${i})">حذف</button>
        </div>`:""}
      </div>
    </article>`;
  }).join("");
}
function updateButtons(){
  $("loginBtn").classList.toggle("hidden",admin);
  $("addBtn").classList.toggle("hidden",!admin);
  $("logoutBtn").classList.toggle("hidden",!admin);
  render();
}
function openForm(g=null,i=""){
  $("gameForm").reset();
  $("gameIndex").value=i;
  $("formTitle").textContent=g?"تعديل لعبة":"إضافة لعبة";
  $("title").value=g?.title||"";
  $("code").value=g?.code==="—"?"":(g?.code||"");
  $("size").value=g?.size==="—"?"":(g?.size||"");
  $("price").value=g?.price||"";
  $("gameDialog").showModal();
}
$("search").addEventListener("input",render);
$("loginBtn").onclick=()=>$("loginDialog").showModal();
$("addBtn").onclick=()=>openForm();
$("logoutBtn").onclick=()=>{admin=false;updateButtons()};

$("loginForm").onsubmit=e=>{
  e.preventDefault();
  if($("password").value===PASSWORD){
    admin=true;$("password").value="";$("loginDialog").close();updateButtons();
  }else alert("كلمة المرور غير صحيحة");
};
window.editGame=i=>openForm(games[i],i);
window.deleteGame=i=>{
  if(confirm(`هل تريد حذف "${games[i].title}"؟`)){
    games.splice(i,1);save();render();
  }
};
$("gameForm").onsubmit=async e=>{
  e.preventDefault();
  const rawIndex=$("gameIndex").value;
  const old=rawIndex!==""?games[Number(rawIndex)]:null;
  const file=$("image").files[0];
  let image=old?.image||"";
  if(file){
    if(!file.type.startsWith("image/")){alert("اختر ملف صورة صالحًا.");return}
    image=await new Promise((resolve,reject)=>{
      const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);
    });
  }
  const item={
    title:$("title").value.trim(),
    code:$("code").value.trim()||"—",
    size:$("size").value||"—",
    price:$("price").value,
    image,
    number:old?.number||games.length+1
  };
  if(rawIndex!=="")games[Number(rawIndex)]=item;else games.push(item);
  save();$("gameDialog").close();render();
};
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>$ (b.dataset.close).close());

save();
render();
</script>
</body>
</html>
